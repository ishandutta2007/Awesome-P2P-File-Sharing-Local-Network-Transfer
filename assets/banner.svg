<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16;border-radius:14px;overflow:hidden;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="nodeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <linearGradient id="nodeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>

    <linearGradient id="nodeGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="lightGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg-grid { stroke: rgba(255, 255, 255, 0.04); stroke-width: 1; }
    .packet-path { stroke: rgba(56, 189, 248, 0.25); stroke-dasharray: 6, 6; stroke-width: 2; fill: none; }
    .packet-path-2 { stroke: rgba(168, 85, 247, 0.25); stroke-dasharray: 6, 6; stroke-width: 2; fill: none; }
    .packet-path-3 { stroke: rgba(16, 185, 129, 0.25); stroke-dasharray: 6, 6; stroke-width: 2; fill: none; }
    
    @keyframes pulseRing {
      0% { r: 18px; opacity: 0.9; }
      50% { r: 34px; opacity: 0; }
      100% { r: 18px; opacity: 0.9; }
    }

    @keyframes floatParticle1 {
      0% { transform: translate(0, 0); opacity: 0.2; }
      50% { transform: translate(40px, -25px); opacity: 0.8; }
      100% { transform: translate(0, 0); opacity: 0.2; }
    }

    @keyframes floatParticle2 {
      0% { transform: translate(0, 0); opacity: 0.3; }
      50% { transform: translate(-35px, 30px); opacity: 0.9; }
      100% { transform: translate(0, 0); opacity: 0.3; }
    }

    .pulse1 { animation: pulseRing 3s ease-in-out infinite; transform-origin: center; }
    .pulse2 { animation: pulseRing 3.5s ease-in-out infinite 0.8s; transform-origin: center; }
    .pulse3 { animation: pulseRing 4s ease-in-out infinite 1.5s; transform-origin: center; }
    
    .particle1 { animation: floatParticle1 6s ease-in-out infinite; }
    .particle2 { animation: floatParticle2 7s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>

  <!-- Subtle High-Tech Grid -->
  <g class="bg-grid">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="450" y1="0" x2="450" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="750" y1="0" x2="750" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
    <line x1="1050" y1="0" x2="1050" y2="360"/>
  </g>

  <!-- Dynamic Constellation & Glowing P2P Streams (Background) -->
  <g opacity="0.6">
    <path class="packet-path" d="M 120 70 Q 250 180 140 290"/>
    <path class="packet-path-2" d="M 140 290 Q 600 330 1060 280"/>
    <path class="packet-path-3" d="M 1060 280 Q 940 160 1080 80"/>
    <path class="packet-path" d="M 1080 80 Q 600 40 120 70"/>

    <!-- Dynamic Flowing Data Particles -->
    <circle r="4" fill="#38bdf8" filter="url(#lightGlow)">
      <animateMotion path="M 120 70 Q 250 180 140 290 Q 600 330 1060 280 Q 940 160 1080 80 Q 600 40 120 70" dur="12s" repeatCount="indefinite" />
    </circle>
    <circle r="3.5" fill="#c084fc" filter="url(#lightGlow)">
      <animateMotion path="M 1080 80 Q 940 160 1060 280 Q 600 330 140 290 Q 250 180 120 70 Q 600 40 1080 80" dur="15s" repeatCount="indefinite" />
    </circle>
    <circle r="3" fill="#34d399" filter="url(#lightGlow)">
      <animateMotion path="M 140 290 Q 600 330 1060 280 Q 940 160 1080 80 Q 600 40 120 70 Q 250 180 140 290" dur="9s" repeatCount="indefinite" />
    </circle>

    <!-- Side Nodes with Radial Pulse -->
    <!-- Node Left-Top -->
    <g transform="translate(120, 70)">
      <circle class="pulse1" fill="none" stroke="#0ea5e9" stroke-width="1.5"/>
      <circle r="12" fill="url(#nodeGrad1)" filter="url(#lightGlow)"/>
      <circle r="5" fill="#ffffff"/>
    </g>

    <!-- Node Left-Bottom -->
    <g transform="translate(140, 290)">
      <circle class="pulse2" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
      <circle r="14" fill="url(#nodeGrad2)" filter="url(#lightGlow)"/>
      <circle r="6" fill="#ffffff"/>
    </g>

    <!-- Node Right-Bottom -->
    <g transform="translate(1060, 280)">
      <circle class="pulse3" fill="none" stroke="#10b981" stroke-width="1.5"/>
      <circle r="13" fill="url(#nodeGrad3)" filter="url(#lightGlow)"/>
      <circle r="5" fill="#ffffff"/>
    </g>

    <!-- Node Right-Top -->
    <g transform="translate(1080, 80)">
      <circle class="pulse1" fill="none" stroke="#0ea5e9" stroke-width="1.5"/>
      <circle r="12" fill="url(#nodeGrad1)" filter="url(#lightGlow)"/>
      <circle r="5" fill="#ffffff"/>
    </g>
  </g>

  <!-- Ambient Glow Behind Foreground Title -->
  <circle cx="600" cy="180" r="160" fill="#3b82f6" opacity="0.12" filter="url(#glow)"/>

  <!-- Foreground Badge Pills -->
  <g transform="translate(600, 75)" text-anchor="middle">
    <rect x="-215" y="-14" width="430" height="28" rx="14" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5"/>
    <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" letter-spacing="1.5">⚡ SERVERLESS • DECENTRALIZED • END-TO-END ENCRYPTED</text>
  </g>

  <!-- Main Hero Title (Crisp Foreground, High Contrast) -->
  <g transform="translate(600, 150)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="44" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.5">
      Awesome P2P File Sharing
    </text>
    <text y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="30" font-weight="700" fill="#f8fafc" letter-spacing="0.2">
      &amp; Local Network Transfer
    </text>
  </g>

  <!-- Subtitle (Clear Foreground Description) -->
  <g transform="translate(600, 240)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94a3b8">
      Curated cross-platform AirDrop alternatives, WebRTC drops, LAN discovery, encrypted CLI beams &amp; continuous sync
    </text>
  </g>

  <!-- Bottom Technology Tags / Features -->
  <g transform="translate(600, 295)" text-anchor="middle">
    <!-- Tag 1 -->
    <g transform="translate(-240, 0)">
      <rect x="-65" y="-13" width="130" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#e2e8f0">🌐 WebRTC P2P</text>
    </g>
    <!-- Tag 2 -->
    <g transform="translate(-80, 0)">
      <rect x="-65" y="-13" width="130" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#e2e8f0">📶 LAN Discovery</text>
    </g>
    <!-- Tag 3 -->
    <g transform="translate(80, 0)">
      <rect x="-65" y="-13" width="130" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#e2e8f0">🔒 PAKE / E2EE</text>
    </g>
    <!-- Tag 4 -->
    <g transform="translate(240, 0)">
      <rect x="-65" y="-13" width="130" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#e2e8f0">🔄 Continuous Sync</text>
    </g>
  </g>
</svg>
